minimum_pre_commit_version: 2.9.3

default_language_version:
  # Force all unspecified python hooks to run python3
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - name: Trim trailing whitespaces
        id: trailing-whitespace
      - name: Add empty line to end of file
        id: end-of-file-fixer
      - name: Check that exectuables have shebangs
        id: check-executables-have-shebangs
      - name: Check XML file syntax parseability
        id: check-xml
      - name: Check JSON file syntax parseability
        id: check-json
      - name: Check YAML file syntax parseability
        id: check-yaml
        args: [ --allow-multiple-documents ]
      - name: Block commits to master
        id: no-commit-to-branch
      - name: Check that no large files were added (>500kB)
        id: check-added-large-files
        args: [ "--maxkb=500" ]
      - name: Checks that no unresolved merge conflict are committed
        id: check-merge-conflict

  # yapf and pylint run from the uv-managed project environment rather than from
  # a pre-commit-managed one: pylint needs the project's imports to resolve, and
  # this keeps their versions in uv.lock instead of a second place. Requires uv
  # on PATH, which the Nix dev shell provides.
  - repo: local
    hooks:
      - name: Format python files with yapf
        id: yapf
        entry: uv run --frozen yapf --in-place
        language: system
        types: [ python ]
      - name: Lint python files with pylint
        id: pylint
        entry: uv run --frozen pylint --rcfile=.pylintrc
        language: system
        types: [ python ]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - name: Check shell scripts with shellcheck
        id: shellcheck
